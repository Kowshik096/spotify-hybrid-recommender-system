global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'spotify-recsys'
    # Metrics are served by the Streamlit app's background HTTP server on
    # METRICS_PORT (default 9090), NOT on the Streamlit web port (8501).
    # Target the container hostname used in docker-compose ('app') and the
    # metrics port so Prometheus actually finds the /metrics endpoint.
    static_configs:
      - targets: ['app:9090']
    metrics_path: '/metrics'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']