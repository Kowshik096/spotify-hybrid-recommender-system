[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spotify-hybrid-recsys"
version = "1.0.0"
description = "Hybrid Music Recommender System (Content-Based + Collaborative Filtering)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.2.1",
    "pandas==2.2.3",
    "scipy==1.14.1",
    "scikit-learn==1.6.0",
    "category-encoders==2.6.4",
    "joblib==1.4.2",
    "dask==2024.12.1",
    "dask-expr==1.1.21",
    "pyarrow==18.1.0",
    "streamlit==1.41.1",
    "dvc==3.58.0",
    "matplotlib==3.10.0",
    "seaborn==0.13.2",
    "pytest==8.3.4",
    "requests==2.32.3",
    "tqdm==4.67.1",
]

[project.optional-dependencies]
dev = [
    "ruff==0.6.0",
    "mypy==1.11.0",
    "pytest-cov==5.0.0",
    "pre-commit==3.8.0",
    "mlflow==2.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "PIE", # flake8-pie
    "T20", # flake8-print
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not use mutable data structures as defaults
]
[tool.ruff.per-file-ignores]
"notebooks/*.py" = ["T201", "T203"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true
exclude = [
    "notebooks/",
    ".venv/",
    "__pycache__/",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "notebooks/*",
    ".venv/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.pre-commit]
repos = [
    { repo = "https://github.com/astral-sh/ruff-pre-commit", rev = "v0.6.0", hooks = [
        { id = "ruff", args = ["--fix"] },
        { id = "ruff-format" },
    ]},
    { repo = "https://github.com/pre-commit/pre-commit-hooks", rev = "v5.0.0", hooks = [
        { id = "trailing-whitespace" },
        { id = "end-of-file-fixer" },
        { id = "check-yaml" },
        { id = "check-added-large-files" },
        { id = "check-merge-conflict" },
    ]},
]